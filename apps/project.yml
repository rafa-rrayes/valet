# Generate Valet.xcodeproj with:  cd apps && xcodegen
# To build under your own Apple account: change DEVELOPMENT_TEAM, bundleIdPrefix and the three
# PRODUCT_BUNDLE_IDENTIFIERs (app, .notify, .uitests) below, run xcodegen, and set the control plane's
# VALET_APNS_TOPIC to the app's bundle ID. The Keychain service name in ValetKit/Support/Keychain.swift can stay.
name: Valet
options:
  bundleIdPrefix: br.com.rrayes
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: N7Z47ZX3FQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: br.com.rrayes.valet
    PRODUCT_NAME: Valet
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DEAD_CODE_STRIPPING: YES
packages:
  ValetKit:
    path: ValetKit
targets:
  Valet-iOS:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
    dependencies:
      - package: ValetKit
        product: ValetKit
      - target: ValetNotify
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: iOS/Valet.entitlements
        INFOPLIST_FILE: iOS/Info.plist
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Valet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: Valet uses Face ID to keep your agents and their requests private.
        NSLocalNetworkUsageDescription: Valet connects to your control plane, which may be on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/Valet.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
  ValetNotify:
    type: app-extension
    platform: iOS
    sources:
      - Notify
    dependencies:
      - package: ValetKit
        product: ValetPushCategories
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.rrayes.valet.notify
        PRODUCT_NAME: ValetNotify
        INFOPLIST_FILE: Notify/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: Valet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  Valet-macOS:
    type: application
    platform: macOS
    sources:
      - macOS
      - Shared
    dependencies:
      - package: ValetKit
        product: ValetKit
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: macOS/Valet.entitlements
        INFOPLIST_FILE: macOS/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Valet
        CFBundleName: Valet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSFaceIDUsageDescription: Valet uses Touch ID to keep your agents and their requests private.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: macOS/Valet.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.aps-environment: development
  # Drives the iOS app against a running control plane (apps/README.md, "Checking it in the simulator"). It skips
  # unless TEST_RUNNER_VALET_E2E_SERVER and TEST_RUNNER_VALET_E2E_PASSWORD are set.
  Valet-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Valet-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.rrayes.valet.uitests
        PRODUCT_NAME: ValetUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Valet-iOS:
    build:
      targets:
        Valet-iOS: all
    test:
      targets:
        - package: ValetKit/ValetKitTests
        - Valet-iOSUITests
  Valet-macOS:
    build:
      targets:
        Valet-macOS: all
    test:
      targets:
        - package: ValetKit/ValetKitTests
