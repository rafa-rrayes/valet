[project]
name = "valet"
version = "0.2.0"
description = "A control plane for always-on AI agents on any ACP harness"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent-client-protocol==0.12.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.161.1",
    "httpx[http2]>=0.28.1",
    "itsdangerous>=2.2.0",
    "mcp>=2.3.0",
    "playwright>=1.64.1",
    "pydantic>=2.12",
    "pyotp>=2.9.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=15.0",
]

[project.scripts]
valet-control = "valet.control.__main__:main"
valet-runner = "valet.runner.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "docker: needs Docker (and the agent-base image); skipped unless VALET_TEST_DOCKER=1",
    "chrome: drives a real Chrome (Playwright's, or VALET_CHROME); skipped unless VALET_TEST_CHROME=1",
]
