# The control plane, as a compose app (plain `docker compose`; also works as Dokploy's raw compose). The image
# is built on the Docker host from this repo:
#
#   docker build -f docker/control/Dockerfile -t valet/control:latest .
#
# Secrets come from the app's environment (VALET_MASTER_KEY, VALET_PUBLIC_URL, VALET_APNS_KEY_ID). The runner
# runs on the host itself (docker/valet-runner.service) and dials 127.0.0.1:8780.
name: valet
services:
  valet-control:
    image: valet/control:latest
    pull_policy: never
    restart: unless-stopped
    init: false                     # tini is the image's PID 1
    shm_size: 1gb                   # Chrome
    mem_limit: 4g
    environment:
      # The address the apps and the browser use (a tunnel's or reverse proxy's, say): https makes the session cookie Secure,
      # and browser requests from any other origin are refused.
      - VALET_PUBLIC_URL=${VALET_PUBLIC_URL}
      - VALET_TRUST_CF_IP=${VALET_TRUST_CF_IP:-1}
      # What agents' texts and the apps call you (empty: "the owner").
      - VALET_OWNER_NAME=${VALET_OWNER_NAME:-}
      # 64 hex characters. Keep a copy offline:
      # without it, the vault and the secrets can't be opened.
      - VALET_MASTER_KEY=${VALET_MASTER_KEY}
      # Where agents reach the MCP gateway: the Docker bridge's address works from container agents (and their
      # network proxies) and from host agents alike. 172.17.0.1 is docker0's default; check `ip -4 addr show docker0`.
      - VALET_GATEWAY_URL=${VALET_GATEWAY_URL:-http://172.17.0.1:8780}
      # The zone schedules and wake-ups run in (VALET_TZ, else this; the image carries tzdata).
      - TZ=${TZ:-UTC}
      # Push to the apps: on once /data/apns.p8 exists and the key ID is set. The topic is the apps' bundle ID:
      # in apps/project.yml (change it there if you build the apps under your own account). SANDBOX=1 while the
      # apps are development builds. Team ID: the Apple developer team that owns the APNs key.
      - VALET_APNS_KEY_FILE=/data/apns.p8
      - VALET_APNS_KEY_ID=${VALET_APNS_KEY_ID:-}
      - VALET_APNS_TEAM_ID=${VALET_APNS_TEAM_ID:-}
      - VALET_APNS_TOPIC=${VALET_APNS_TOPIC:-}
      - VALET_APNS_SANDBOX=${VALET_APNS_SANDBOX:-1}
    volumes:
      - valet-data:/data            # database, definitions repo, Chrome profiles, shared files
    ports:
      - "127.0.0.1:8780:8780"                       # the runner on the host, and the tunnel
      - "${VALET_BRIDGE_IP:-172.17.0.1}:8780:8780"  # agents (VALET_GATEWAY_URL); not reachable from outside the box

volumes:
  valet-data:
    external: true                  # docker volume create valet-data
